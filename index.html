/* ---------------- session building ---------------- */
const T = (kind, item) => ({ kind, item });
function vocabTasks(maxDue, maxNew){
  const due = dueCards().slice(0, maxDue).map(v => T("card", v));
  const nw = unseenCards().slice(0, Math.min(maxNew, newAllowance())).map(v => T("card", v));
  return shuffle(due).concat(nw);
}
function grammarTasks(n){
  const g = pickItems("grammar", Math.ceil(n*0.6)).map(it => T("grammar", it));
  const k = pickItems("kwt", n - g.length).map(it => T("kwt", it));
  return shuffle(g.concat(k));
}
function startSession(mode){
  let q = [];
  if (mode === "daily"){
    const cards = vocabTasks(40, S.settings.newPerDay);
    const ex = shuffle([
      ...grammarTasks(2),
      ...pickItems("listening", 2).map(i => T("listening", i)),
      ...pickItems("pron", 2).map(i => T("pron", i)),
      ...pickItems("writing", 1).map(i => T("writing", i)),
      ...pickItems("conversation", 1).map(i => T("conversation", i))
    ]);
    const step = Math.max(1, Math.ceil(cards.length / (ex.length + 1)));
    let ci = 0;
    for (const e of ex){ q.push(...cards.slice(ci, ci+step)); ci += step; q.push(e); }
    q.push(...cards.slice(ci));
  } else if (mode === "vocab"){
    q = vocabTasks(30, S.settings.newPerDay);
    if (!q.length){
      const pool = C.vocab.filter(v => S.cards[v.id]).sort((a,b) => S.cards[a.id].due - S.cards[b.id].due).slice(0, 10);
      q = shuffle(pool).map(v => T("card", v));
      if (q.length) toast("No hay repasos pendientes: repasas por adelantado");
    }
  } else if (mode === "grammar") q = grammarTasks(8);
  else if (mode === "listening") q = pickItems("listening", 6).map(i => T("listening", i));
  else if (mode === "pron") q = pickItems("pron", 8).map(i => T("pron", i));
  else if (mode === "writing") q = pickItems("writing", 6).map(i => T("writing", i));
  else if (mode === "conversation") q = pickItems("conversation", 6).map(i => T("conversation", i));
  if (!q.length){ toast("No hay nada pendiente ahora mismo"); return; }
  session = { mode, q, i:0, xp:0, right:0, total:0, requeued:{} };
  view = "session"; render(); window.scrollTo(0,0);
}
function award(n, ok){
  session.xp += addXP(n); session.total++; if (ok) session.right++;
  const el = $(".xp-count"); if (el){ el.textContent = `+${session.xp} XP`; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
function next(){
  session.i++;
  if (session.i >= session.q.length){ view = "summary"; render(); window.scrollTo(0,0); return; }
  renderTask(); window.scrollTo(0,0);
}
function requeue(task){
  const id = task.item.id; session.requeued[id] = (session.requeued[id]||0) + 1;
  if (session.requeued[id] > 2) return;
  const at = Math.min(session.q.length, session.i + 4 + rand(3));
  session.q.splice(at, 0, task);
}

    <div class="bubble"><span>${esc(c.l)}</span><button class="icon-btn" data-say="${esc(c.l)}" aria-label="Escuchar">${I.speaker}</button></div>
    <p class="small muted" style="margin:0">¿Qué respondes?</p>
    <div class="options" role="group" aria-label="Respuestas">${order.map(i => `<button class="opt" data-i="${i}"><span>${esc(c.o[i].t)}<span class="opt-why" hidden>${esc(c.o[i].w)}</span></span></button>`).join("")}</div>`;
  bindSay(box);
  setTimeout(() => say(c.l), 300);
  $$(".opt", box).forEach(b => b.onclick = () => {
    const i = +b.dataset.i, ok = !!c.o[i].ok;
    $$(".opt", box).forEach(x => { x.disabled = true; const xi = +x.dataset.i; $(".opt-why", x).hidden = false; if (c.o[xi].ok) x.classList.add("correct"); else if (x === b) x.classList.add("wrong"); else x.classList.add("dim"); });
    record(c.id, ok); award(ok ? 10 : 3, ok);
    const best = c.o.find(o => o.ok);
    feedback(box, ok, ok ? pickMsg(GOOD) : "Un nativo diría otra cosa", `<p class="entry-ex">${esc(best.t)} <button class="icon-btn" style="width:32px;height:32px;display:inline-grid;vertical-align:middle" data-say="${esc(best.t)}" aria-label="Escuchar la respuesta">${I.speaker}</button></p>`);
  });
}

/* ---------------- summary ---------------- */
function renderSummary(){
  const s = session || { xp:0, right:0, total:0, mode:"daily" };
  const lv = levelInfo(S.xp.total), st = streak(), xt = xpToday(), goal = S.settings.goal;
  const pct = s.total ? Math.round(s.right / s.total * 100) : 0;
  root().innerHTML = `
  <div class="screen">
    <div class="topline"><span class="brand">Idiolect</span><span class="streak">${I.flame}<span class="num">${st}</span> ${st===1?"día":"días"}</span></div>
    <div class="empty">
      <p class="muted" style="margin:0">Sesión terminada</p>
      <p class="summary-big num">+${s.xp} XP</p>
      <p style="margin:0">${xt >= goal ? (st > 1 ? `Objetivo de hoy cumplido. Llevas ${st} días seguidos.` : "Objetivo de hoy cumplido. Mañana empieza tu racha.") : `Te faltan ${goal - xt} XP para el objetivo de hoy.`}</p>
    </div>
    <dl class="stats">
      <div><dt>Aciertos</dt><dd>${s.right}/${s.total}</dd></div>
      <div><dt>Precisión</dt><dd>${pct} %</dd></div>
      <div><dt>Hoy</dt><dd>${xt} XP</dd></div>
    </dl>
    <div class="level">
      <div class="level-row"><span class="level-name">${esc(lv.title)}</span><span class="small muted num">Nivel ${lv.level}</span></div>
      <div class="bar"><i style="width:${(lv.into/lv.need*100).toFixed(1)}%"></i></div>
      <span class="xs muted num">${lv.need - lv.into} XP para el nivel ${lv.level+1}</span>
    </div>
    <div class="row">
      <button class="btn" id="again">Otra ronda</button>
      <button class="btn btn-primary" id="home">Volver a Hoy</button>
    </div>
  </div>`;
  $("#home").onclick = () => go("today");
  $("#again").onclick = () => startSession(s.mode);
}

/* ---------------- progress ---------------- */
function renderProgress(){
  const lv = levelInfo(S.xp.total), st = streak();
  const counts = { new:0, learning:0, young:0, mastered:0 };
  C.vocab.forEach(v => counts[cardStatus(v.id)]++);
  const N = C.vocab.length;
  const segs = [["mastered","Dominadas","--s4"],["young","Consolidando","--s3"],["learning","Aprendiendo","--s2"],["new","Sin ver","--s0"]];
  const acc = kinds => { let n=0, ok=0; kinds.forEach(k => C[k].forEach(it => { const s = S.items[it.id]; if (s){ n += s.n; ok += s.ok; } })); return n ? ok/n : null; };
  const vocabAcc = (() => { let n=0, l=0; Object.values(S.cards).forEach(c => { n += c.reps + c.lapses; l += c.lapses; }); return n ? 1 - l/n : null; })();
  const rows = [["Vocabulario", vocabAcc],["Gramática", acc(["grammar","kwt"])],["Listening", acc(["listening"])],["Pronunciación", acc(["pron"])],["Escritura", acc(["writing"])],["Conversación", acc(["conversation"])]];
  const days = Object.values(S.xp.days).filter(v => v > 0).length;
  root().innerHTML = `
  <div class="screen">
    <h1 class="section-title">Progreso</h1>
    <div class="level">
      <div class="level-row"><span class="level-name">${esc(lv.title)}</span><span class="small muted num">Nivel ${lv.level}</span></div>
      <div class="bar"><i style="width:${(lv.into/lv.need*100).toFixed(1)}%"></i></div>
      <span class="xs muted num">${lv.into} de ${lv.need} XP en este nivel</span>
    </div>
    <dl class="stats">
      <div><dt>Racha actual</dt><dd>${st} ${st===1?"día":"días"}</dd></div>
      <div><dt>Mejor racha</dt><dd>${S.best} ${S.best===1?"día":"días"}</dd></div>
      <div><dt>XP total</dt><dd>${S.xp.total}</dd></div>
      <div><dt>Días estudiados</dt><dd>${days}</dd></div>
    </dl>
    <section class="spectro" aria-label="Actividad">
      <canvas id="spec" role="img" aria-label="${esc(spectroLabel(42))}"></canvas>
      <div class="spectro-foot"><span>${fmtShort(today()-41)}</span><span>Cada columna es un día; más alta, más XP</span><span>hoy</span></div>
    </section>
    <section class="setting" aria-labelledby="vh">
      <h2 class="section-title" id="vh" style="font-size:var(--t-l)">Vocabulario</h2>
      <div class="stack" role="img" aria-label="${segs.map(s => `${s[1]}: ${counts[s[0]]}`).join(", ")}">${segs.map(s => `<i style="width:${counts[s[0]]/N*100}%;background:var(${s[2]})"></i>`).join("")}</div>
      <ul class="legend">${segs.map(s => `<li><i style="background:var(${s[2]})"></i>${s[1]} <span class="num">${counts[s[0]]}</span></li>`).join("")}</ul>
    </section>
    <section class="setting" aria-labelledby="ah">
      <h2 class="section-title" id="ah" style="font-size:var(--t-l)">Precisión por habilidad</h2>
      <ul class="acc-list">${rows.map(([n,v]) => `<li><span>${n}</span><div class="bar"><i style="width:${v==null?0:v*100}%"></i></div><span>${v==null?"sin datos":Math.round(v*100)+" %"}</span></li>`).join("")}</ul>
    </section>
  </div>`;
  drawSpectro($("#spec"), 42);
}

/* ---------------- settings ---------------- */
function seg(id, label, value, opts, help=""){
  return `<div class="setting"><span class="lbl" id="${id}-l">${label}</span>
    <div class="seg" role="group" aria-labelledby="${id}-l">${opts.map(([v,t]) => `<button data-set="${id}" data-v="${v}" aria-pressed="${String(v) === String(value)}">${t}</button>`).join("")}</div>
    ${help ? `<p class="help">${help}</p>` : ""}</div>`;
}
function renderSettings(){
  const s = S.settings;
  root().innerHTML = `
  <div class="screen">
    <h1 class="section-title">Ajustes</h1>
    <div class="settings">
      ${seg("accent","Acento de la voz", s.accent, [["en-GB","Británico"],["en-US","Americano"]], "Usa las voces instaladas en tu iPhone. En Ajustes → Accesibilidad → Contenido leído → Voces puedes descargar voces de mejor calidad.")}
      <div class="setting"><label for="rate">Velocidad de la voz</label>
        <input type="range" id="rate" min="0.6" max="1.15" step="0.05" value="${s.rate}">
        <div class="row"><button class="btn btn-quiet" id="test">Probar la voz</button></div></div>
      ${seg("newPerDay","Palabras nuevas al día", s.newPerDay, [[5,"5"],[8,"8"],[12,"12"],[20,"20"]])}
      ${seg("goal","Objetivo diario", s.goal, [[30,"30 XP"],[60,"60 XP"],[100,"100 XP"],[150,"150 XP"]], "La racha suma un día cada vez que llegas al objetivo.")}
      ${seg("theme","Tema", s.theme, [["system","Sistema"],["light","Claro"],["dark","Oscuro"]])}
      <div class="setting"><span class="lbl">Copia de seguridad</span>
        <p class="help">Tu progreso se guarda solo en este navegador. Copia el código y guárdalo en Notas para no perderlo o pasarlo a otro dispositivo.</p>
        <div class="row"><button class="btn" id="exp">Copiar mi progreso</button></div>
        <textarea class="field" id="bk" placeholder="Pega aquí un código de copia para restaurarlo" aria-label="Código de copia de seguridad"></textarea>
        <div class="row"><button class="btn" id="imp">Restaurar progreso</button></div></div>
      <div class="setting"><span class="lbl">Instalarla en el iPhone</span>
        <p class="help">Abre la app en Safari, toca Compartir y elige «Añadir a pantalla de inicio». Se abrirá a pantalla completa y funcionará sin conexión.</p></div>
      <div class="setting"><span class="lbl">Borrar progreso</span>
        <div class="row"><button class="btn danger" id="reset">Borrar todo el progreso</button></div>
        <div class="row" id="confirm" hidden><button class="btn" id="no">Cancelar</button><button class="btn btn-primary" id="yes" style="background:var(--bad);border-color:var(--bad)">Sí, borrar todo</button></div></div>
      <p class="xs muted">Idiolect · ${C.vocab.length} expresiones, ${C.grammar.length + C.kwt.length} ejercicios de gramática, ${C.listening.length} dictados, ${C.pron.length} de pronunciación, ${C.writing.length} de escritura y ${C.conversation.length} conversaciones.</p>
    </div>
  </div>`;
  $$("[data-set]").forEach(b => b.onclick = () => {
    const k = b.dataset.set; let v = b.dataset.v; if (k === "newPerDay" || k === "goal") v = +v;
    S.settings[k] = v; save(); if (k === "theme") applyTheme();
    $$(`[data-set="${k}"]`).forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === String(v))));
  });
  $("#rate").oninput = e => { S.settings.rate = +e.target.value; save(); };
  $("#test").onclick = () => say("Fair enough, but what about the deadline?");
  $("#exp").onclick = async () => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const ta = $("#bk");
    try { await navigator.clipboard.writeText(code); toast("Progreso copiado. Pégalo en Notas."); }
    catch(e){ ta.value = code; ta.focus(); ta.select(); toast("Copia el código seleccionado"); }
  };
  $("#imp").onclick = () => {
    const v = $("#bk").value.trim(); if (!v) { toast("Pega primero un código de copia"); return; }
    try {
      const o = JSON.parse(decodeURIComponent(escape(atob(v))));
      if (!o.cards || !o.xp) throw 0;
      S = Object.assign(fresh(), o); S.settings = Object.assign({...DEFAULTS}, o.settings||{}); save(); applyTheme();
      toast("Progreso restaurado"); renderSettings();
    } catch(e){ toast("Ese código no es válido. Copia el código completo."); }
  };
  $("#reset").onclick = () => { $("#confirm").hidden = false; $("#reset").hidden = true; };
  $("#no").onclick = () => { $("#confirm").hidden = true; $("#reset").hidden = false; };
  $("#yes").onclick = () => { const keep = S.settings; S = fresh(); S.settings = keep; save(); toast("Progreso borrado"); go("today"); };
}

/* ---------------- boot ---------------- */
function boot(){
  load(); applyTheme();
  $$(".tab").forEach(b => b.onclick = () => go(b.dataset.view));
  $$(".tab").forEach(b => { const ic = $(".ti", b); if (ic) ic.innerHTML = I[b.dataset.view]; });
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const redraw = () => { if (view === "today") drawSpectro($("#spec"), 28); if (view === "progress") drawSpectro($("#spec"), 42); };
  mq.addEventListener ? mq.addEventListener("change", redraw) : mq.addListener(redraw);
  new MutationObserver(redraw).observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(redraw, 150); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && view === "today") render(); });
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:" && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
window.IDIOLECT_TEST = { levelInfo, gradeCard, wordDiff, norm, lev, streak, get S(){ return S; }, set S(v){ S = v; }, keyFromNum, today, startSession, get session(){ return session; } };
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
</body>
</html>
